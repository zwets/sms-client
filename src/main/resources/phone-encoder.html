  <head>
    <title>Phone Number Encoder</title>
    <meta charset="utf-8">
    <style type="text/css">

body {
    font-family: Verdana, Sans;
}

div#div_main {
    padding: 10px 20px;
}
div#div_main.good {
  background-color: #CFC;
}
div#div_main.wrong {
  background-color: #FCC;
}

div#div_input {
  padding: 20px 20px;
}
#input {
  font-family: Sans Mono, Mono;
  font-weight: bold;
  font-size: 300%;
  border-style: none;
  border-color: #000;
  padding: 10px 20px;
}
#input.good {
  color: #010;
  background-color: #EFE;
}
#input.wrong {
  color: #100;
  background-color: #FEE;
}

div#div_output {
    padding: 20px 20px;
}
#output {
    font-family: Sans Mono, Mono;
    font-weight: bold;
    font-size: 450%;
    border-style: solid;
    padding: 10px 20px;
}
#output.good {
  color: #010;
  background-color: #FFE;
  border-color: #060;
}
#output.wrong {
  color: #988;
  background-color: #FEE;
  border-color: #988;
}

div#div_alphabet {
    padding: 20px 20px;
}
#alphabet {
    font-family: Sans Mono, Mono;
    font-size: 80%;
    border-style: solid;
    border-width: 1px;
    padding: 2px 4px;
}
#alphabet.good {
  color: #010;
  background-color: #EFE;
  border-color: #060;
}
#alphabet.bad {
  color: #100;
  background-color: #FEE;
}
    </style>
    <script type="application/javascript">
"use strict";

window.onload = function () {

  var main_div = document.getElementById("div_main");
  var input_div = document.getElementById("div_input");
  var input_field = document.getElementById("input");
  var output_div = document.getElementById("div_output");
  var output_field = document.getElementById("output");
  var alphabet_div = document.getElementById("div_alphabet");
  var alphabet_field = document.getElementById("alphabet");
  var alphabet_param = new URLSearchParams(window.location.search).get('alphabet');
  const default_alphabet = "0297WCYSD6AFKQEJ5N3BT4G8PXMHZ1VR";

  function encode (phonenumber, alphabet) {

    var r = /^0([0-9]{9})$/.exec(phonenumber);
    var a = /^([0123456789ABCDEFGHJKMNPQRSTVWXYZ]{32})$/.exec(alphabet);
    if (r !== null && a !== null) {

      var p = r[1], n = 0;
      for (var i = 0; i < 6; ++i)
        for (var j = 0; j < 5; ++j, p >>= 1)
          n |= (p & 1) << (29 - (6*j + i));

      var s = "", w = 6;
      do { s = a[1].charAt(n & 31) + s; n >>= 5; w -= 1; } while (n != 0 || w > 0);

      return s.substr(0,3) + "-" + s.substr(3,3);
    }
  }

  function decode (crockcode, alphabet) {

    var r = /^([0123456789ABCDEFGHJKMNPQRSTVWXYZ]{3})-([0123456789ABCDEFGHJKMNPQRSTVWXYZ]{3})$/.exec(crockcode);
    var a = /^([0123456789ABCDEFGHJKMNPQRSTVWXYZ]{32})$/.exec(alphabet);
    if (r !== null && a !== null) {

      var n = 0;
      for (const c of (r[1] + r[2])) n = (n << 5) + a[1].indexOf(c);

      var p = 0;
      for (var i = 0; i < 5; ++i)
        for (var j = 0; j < 6; ++j, n >>= 1)
          p |= (n & 1) << (29 - (5*j + i));

      return p.toString().padStart(10, "0");
    }
  }

  function set_output (str) {
    if (str) {
      main_div.className = input_div.className = input_field.className = output_div.className = output_field.className = "good";
      output_field.value = str;
    }
    else {
      main_div.className = input_div.className = input_field.className = output_div.className = output_field.className = "wrong";
      output_field.value = "???-???";
    }
  }

  function set_input (str) {
    if (str) {
      main_div.className = input_div.className = input_field.className = output_div.className = output_field.className = "good";
      input_field.value = str;
    }
    else {
      main_div.className = input_div.className = input_field.className = output_div.className = output_field.className = "wrong";
      input_field.value = "0";
    }
  }

  input_field.addEventListener("input", function (ev) {
    var input = input_field.value;
    if (input.length == 0) {
      input_field.value = "0";
    }
    else if (input.charAt(0) != '0') {
      input_field.value = "0" + input; //input.slice(0,9);
    }
    set_output(encode(input_field.value,alphabet_field.value));
  }, false);

  output_field.addEventListener("input", function (ev) {
    var output = output_field.value
    var s = output_field.selectionStart, e = output_field.selectionEnd;
    if (output.length > 3 && output.indexOf('-') == -1) {
      if (s >= 3) ++s;
      if (e >= 3) ++e;
      output = output.substr(0,3) + "-" + output.substr(3,3);
    }
    output_field.value = output.toUpperCase();
    output_field.setSelectionRange(s,e);
    set_input(decode(output_field.value,alphabet_field.value));
  }, false);

  alphabet_field.addEventListener("input", function (ev) {
    alphabet_div.className = alphabet_field.className = /^([0123456789ABCDEFGHJKMNPQRSTVWXYZ]{32})$/.exec(alphabet_field.value) ? "good" : "bad";
    set_output(encode(input_field.value,alphabet_field.value));
    set_input(decode(output_field.value,alphabet_field.value));
  }, false);

  alphabet_field.value = alphabet_param !== null ? alphabet_param : default_alphabet;
  alphabet_div.className = alphabet_field.className = /^([0123456789ABCDEFGHJKMNPQRSTVWXYZ]{32})$/.exec(alphabet_field.value) ? "good" : "bad";
  input_field.value = "0";
  input_field.focus();
  set_output (null);

}
    </script>
  </head>
  <body>
    <div id="div_main">
      <div id="div_input">
        <input id="input" size="10" maxlength="10" pattern="0[0-9]{9}" title="Enter a 10 digit phone number starting with 0" autocomplete="off" autofocus="true"></input>
      </div>
      <div id="div_output">
        <input id="output" size="7" maxlength="7" pattern="[0123456789ABCDEFGHJKMNPQRSTVWXYZ]{3}-[0123456789ABCDEFGHJKMNPQRSTVWXYZ]{3}" title="Enter a crock code" autocomplete="off"</input>
      </div>
      <div id="div_alphabet">
        <input id="alphabet" size="32" maxlength="32" pattern="[0123456789ABCDEFGHJKMNPQRSTVWXYZ]{32}" title="Enter the 32 character shuffled alphabet" autocomplete="off"></input>
      </div>
    </div>
  </body>
